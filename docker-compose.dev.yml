services:
  db:
    image: postgres:16-alpine
    container_name: plusdesign-db
    environment:
      POSTGRES_USER: plusdesign
      POSTGRES_PASSWORD: plusdesign
      POSTGRES_DB: plusdesign
    ports:
      - "5432:5432"
    volumes:
      - plusdesign-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plusdesign -d plusdesign"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plusdesign-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://plusdesign:plusdesign@db:5432/plusdesign
      ENVIRONMENT: local
      JWT_SECRET: dev-only-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - plusdesign-media-dev:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: plusdesign-frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  plusdesign-pgdata-dev:
  plusdesign-media-dev:
