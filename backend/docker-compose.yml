services:
  db:
    image: postgres:16-alpine
    container_name: plusdesign-db
    environment:
      POSTGRES_USER: plusdesign
      POSTGRES_PASSWORD: plusdesign
      POSTGRES_DB: plusdesign
    ports:
      - "5432:5432"
    volumes:
      - plusdesign-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plusdesign -d plusdesign"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://plusdesign:plusdesign@db:5432/plusdesign
      ENVIRONMENT: local
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  plusdesign-pgdata:
