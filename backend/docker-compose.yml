services:
  db:
    image: postgres:16-alpine
    container_name: plusdesign-db
    environment:
      POSTGRES_USER: plusdesign
      POSTGRES_PASSWORD: plusdesign
      POSTGRES_DB: plusdesign
    ports:
      - "5432:5432"
    volumes:
      - plusdesign-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plusdesign -d plusdesign"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plusdesign-pgdata:
